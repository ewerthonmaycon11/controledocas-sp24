{% extends 'base.html' %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Autenticação Restrita</h2>
            <p>Acesse com suas credenciais autorizadas</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-primary">Entrar no Painel</button>
        </form>
        <div class="login-footer" style="display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="{{ url_for('register') }}" style="color: var(--accent-blue);">Não tem conta? Solicitar Cadastro</a>
            <a href="{{ url_for('index') }}">← Voltar para o Monitor de Docas</a>
        </div>
    </div>
</div>
{% endblock %}
