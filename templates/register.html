{% extends 'base.html' %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Criar Nova Conta</h2>
            <p>Cadastre-se para solicitar acesso ao controle de docas</p>
        </div>
        <form method="POST" action="{{ url_for('register') }}" class="login-form">
            <div class="form-group">
                <label for="username">Nome de Usuário / Operador</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Crie uma senha segura" required>
            </div>
            <button type="submit" class="btn-primary">Solicitar Cadastro</button>
        </form>
        <div class="login-footer">
            <a href="{{ url_for('login') }}">Já possui conta? Faça Login</a>
        </div>
    </div>
</div>
{% endblock %}
